[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "varve"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "click>=8.1",
    "httpx>=0.27",
    "boto3>=1.34",
    "pyyaml>=6.0",
    "sse-starlette>=3.4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "moto[s3]>=5.0",
]

[project.scripts]
varve = "varve.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
