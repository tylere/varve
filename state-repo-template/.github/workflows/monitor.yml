name: Monitor datasets
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore check intervals and check every enabled dataset now"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write   # lets the job sign in to source.coop as a service account

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4

      - run: uv tool install "varve @ git+https://github.com/tylere/varve.git@main"

      - name: Configure git
        run: |
          git config user.email "varve-bot@users.noreply.github.com"
          git config user.name "Varve Bot"

      - name: Sign in to source.coop
        if: vars.SOURCE_COOP_SERVICE_ACCOUNT != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.SOURCE_COOP_SERVICE_ACCOUNT }}:role/FullAccess
          audience: https://data.source.coop
          sts-endpoint: https://data.source.coop/.sts
          aws-region: us-west-2
          # Credentials last 1 hour by default and are not renewed during the job;
          # raise this (max 43200) if a run uploads for longer.
          # role-duration-seconds: 3600

      - name: Run monitor
        env:
          VARVE_STATE_REPO_PATH: "."
          VARVE_DRYAD_CREDENTIALS: ${{ secrets.VARVE_DRYAD_CREDENTIALS }}
          VARVE_SC_CREDENTIALS: ${{ vars.VARVE_SC_CREDENTIALS }}
        run: varve monitor run ${{ inputs.force && '--force' || '' }}
